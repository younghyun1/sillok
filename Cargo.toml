[package]
name = "sillok"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
description = "A structured CLI chronicle for agentic daily work logs."
readme = "README.md"
repository = "https://github.com/younghyun1/sillok"
homepage = "https://github.com/younghyun1/sillok"
documentation = "https://docs.rs/sillok"
license = "MIT OR Apache-2.0"
keywords = ["agent", "archive", "cli", "journal", "tasks"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "Cargo.lock",
    "Cargo.toml",
    "README.md",
    "docs/**",
    "src/**",
    "tests/**",
]

[profile.release]
opt-level = 3
codegen-units = 1
debug = false
incremental = false
strip = true
lto = true
panic = "abort"

[dependencies]
bitcode = "0.6.9"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.1", features = ["derive", "env"] }
directories = "6.0.0"
fs2 = "0.4.3"
nutype = { version = "0.7.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
turso = "0.5.3"
uuid = { version = "1.23.1", features = ["serde", "v7"] }
zstd = "0.13.3"

[dev-dependencies]
assert_cmd = "2.2.2"
derive_fuzztest = { version = "0.1.4", features = ["proptest"] }
predicates = "3.1.4"
tempfile = "3.27.0"
