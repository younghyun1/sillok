[package]
name = "sillok"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 3
codegen-units = 1
debug = false
incremental = false
strip = true
lto = true
panic = "abort"

[dependencies]
bitcode = "0.6.9"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.1", features = ["derive", "env"] }
directories = "6.0.0"
fs2 = "0.4.3"
nutype = { version = "0.6.2", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.23.1", features = ["serde", "v7"] }
zstd = "0.13.3"

[dev-dependencies]
assert_cmd = "2.1.1"
derive_fuzztest = { version = "0.1.4", features = ["proptest"] }
predicates = "3.1.3"
tempfile = "3.23.0"
