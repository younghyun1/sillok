# Sillok is built on the machine that runs it (`cargo install --path .`), so the
# host CPU is the deployment target and `native` is the oldest safe level. Any
# prebuilt binary shipped to other machines must override this with a baseline
# such as x86-64-v3.
[build]
rustflags = ["-Ctarget-cpu=native"]

# Rebuild std so target-cpu and LTO reach it. Release builds abort on panic;
# dev and test builds keep the default unwind strategy, so both runtimes are
# listed. No musl target: the CLI also builds on macOS and is never packaged
# into a scratch image.
[unstable]
build-std = ["core", "alloc", "std", "panic_abort", "panic_unwind"]
